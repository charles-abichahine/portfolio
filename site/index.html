<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Square icons. logo.svg is 110x100, and Google rejects a non-square favicon
      for search results (it wants a square, ideally a multiple of 48px), so the
      mark is recomposed square here. favicon.ico is listed first because Google
      and older browsers probe /favicon.ico regardless of what is declared.
    -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The paper value from index.css, so a phone browser paints its chrome
         the colour of the page rather than of its own default. One tag, no
         media attribute: the page follows the stored choice, not the OS scheme,
         so a prefers-color-scheme variant here would paint dark chrome around a
         light page whenever the OS is dark and no choice is stored. The boot
         script below and the island's applyTheme keep this in step with
         data-theme instead — both hardcode the same two paper values. -->
    <meta name="theme-color" content="#f4f5f6" />
    <meta
      name="description"
      content="Charles Abi Chahine • architect & computational designer. MaCAD, IAAC. Computational design, BIM workflows, and AI in architecture."
    />
    <title>Charles Abi Chahine • Architect &amp; Computational Designer</title>
    <link rel="canonical" href="https://charlesabichahine.com/" />

    <!-- Google Search Console ownership verification. Must stay in <head>. -->
    <meta name="google-site-verification" content="uDwArUniJUsZsppoYJIS4WyesimrzpZZ5glsESX15Jw" />

    <!--
      Social preview. The site is a client-rendered SPA, so every route serves
      this same head: the card is deliberately about the person, not the page,
      which reads correctly wherever a link is shared. og:image must be an
      absolute URL: Slack/LinkedIn/WhatsApp will not resolve a relative one.

      The ?v on the image is a cache bust, and it is not optional. LinkedIn does
      not hotlink the card, it copies it to media.licdn.com under a permanent
      asset id and keys that copy on the URL it was fetched from. Replacing
      og-image.png at the same path and re-running Post Inspector re-reads the
      page and still hands back the old picture, because the image URL never
      changed and so nothing tells LinkedIn to fetch it again. Bump the number
      whenever scripts/og-image.mjs regenerates the card.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Charles Abi Chahine" />
    <meta property="og:url" content="https://charlesabichahine.com/" />
    <meta property="og:title" content="Charles Abi Chahine • Architect &amp; Computational Designer" />
    <meta
      property="og:description"
      content="Architect and computational designer (MaCAD, IAAC). Projects across computational design, BIM workflows, and AI in architecture."
    />
    <meta property="og:image" content="https://charlesabichahine.com/og-image.png?v=4" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Charles Abi Chahine, architect and computational designer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Charles Abi Chahine • Architect &amp; Computational Designer" />
    <meta
      name="twitter:description"
      content="Architect and computational designer (MaCAD, IAAC). Projects across computational design, BIM workflows, and AI in architecture."
    />
    <meta name="twitter:image" content="https://charlesabichahine.com/og-image.png?v=4" />
    <!--
      The two faces on screen the instant anything renders: the sans that sets
      the name and every heading, and the mono that sets every label. They are
      declared in a stylesheet that is imported by the JS bundle, so without
      these hints the browser cannot even discover them until the module graph
      has been parsed. Preloading moves both downloads to the very start of the
      page load and removes the swap that would otherwise land mid-read.

      The serif is deliberately not here: it sets body copy, which no route shows
      above the fold, and preloading it would compete with these two for the same
      first bytes. crossorigin is required even same-origin — a font is always
      fetched in CORS mode, and a preload whose mode does not match the eventual
      request is discarded and fetched a second time.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/space-grotesk-300700.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-mono-400.woff2" />

    <!--
      Resolve the theme before first paint, or the page renders one theme and
      then snaps to the other once React mounts. Must stay inline and stay in
      <head>: an external file would be another round trip with the flash inside
      it. Light is the default — a first visit (or any visit with no stored
      choice) opens light regardless of the OS setting; only an explicit toggle,
      persisted in localStorage, moves it to dark.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'dark' ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          if (theme === 'dark') {
            // Keep the browser chrome on the page's paper. The light value is
            // already in the tag, so only dark needs writing.
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#131317')
          }
        } catch (e) {
          // localStorage throws in some privacy modes — fall back to light.
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The one page a visitor without JavaScript gets. Every stylesheet ships
      inside the JS bundle, so this block styles itself: without it, no-JS is
      a blank white page with nothing to click. Colours are the paper/ink pair
      from index.css.
    -->
    <noscript>
      <style>
        body { margin: 0; background: #f4f5f6; }
        .njs {
          min-height: 100vh; display: flex; flex-direction: column;
          justify-content: center; align-items: center; text-align: center;
          padding: 24px; box-sizing: border-box;
          font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #17181c;
        }
        .njs h1 { font-size: 28px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
        .njs h1 span { color: #c9261b; }
        .njs .role {
          margin-top: 10px; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
          font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: #6a707b;
        }
        .njs p { margin: 22px 0 0; max-width: 34em; font-size: 15px; line-height: 1.6; color: #3d414a; }
        .njs .links { margin-top: 26px; font-size: 14px; }
        .njs a { color: #1a5fd0; text-decoration: underline; text-underline-offset: 3px; }
      </style>
      <div class="njs">
        <h1>Charles Abi Chahine<span>.</span></h1>
        <div class="role">architect &middot; computational designer</div>
        <p>
          This portfolio is drawn in the browser and needs JavaScript to render its
          projects, galleries, and drawings. Enable JavaScript and reload &mdash; or
          reach me directly below.
        </p>
        <div class="links">
          <a href="mailto:charles.abichahine@gmail.com">charles.abichahine@gmail.com</a>
          &nbsp;&middot;&nbsp;
          <a href="https://www.linkedin.com/in/CharlesAbiChahine">LinkedIn</a>
          &nbsp;&middot;&nbsp;
          <a href="/cv.pdf">CV (PDF)</a>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
